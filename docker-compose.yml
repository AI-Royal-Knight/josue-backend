services:
  web:
    build: .
    container_name: josue_web
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database — mount to a directory, not a file
      - db_data:/app/sqlite_data
      # Persist uploaded media files
      - media_data:/app/media
      # Hot-reload app code (remove in production)
      - .:/app
      # Protect the venv from the bind mount above
      - /opt/venv
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: josue_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: josue_celery_worker
    command: celery -A config worker -l info
    volumes:
      - db_data:/app/sqlite_data
      - media_data:/app/media
      - .:/app
      - /opt/venv
    env_file:
      - .env
    depends_on:
      - redis
      - web
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: josue_celery_beat
    command: celery -A config beat -l info
    volumes:
      - db_data:/app/sqlite_data
      - media_data:/app/media
      - .:/app
      - /opt/venv
    env_file:
      - .env
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  db_data:
  media_data:
